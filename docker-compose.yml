version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_USER: ai_cfo
      POSTGRES_PASSWORD: ai_cfo_password
      POSTGRES_DB: ai_cfo_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /opt:/host_opt
      - /var/www:/host_www
    env_file:
      - ./.env
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://ai_cfo:ai_cfo_password@db:5432/ai_cfo_db
    depends_on:
      - db
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        pip install bcrypt passlib[bcrypt] --quiet
        sleep 3
        echo  | base64 -d > /tmp/init_db.py
        python /app/init_db_rag.py
        exec uvicorn main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
